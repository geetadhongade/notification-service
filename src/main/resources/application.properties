spring.application.name=notification-service

# ---------- Database ----------
# Our own database (not shop-api's): remembers which events were already handled
spring.datasource.url=jdbc:postgresql://localhost:5432/notification
spring.datasource.username=geetadhongade
spring.datasource.password=

# ---------- Kafka (consumer) ----------
# Where Kafka runs (from a container this would be kafka:29092)
spring.kafka.bootstrap-servers=localhost:9092
# All copies of this service share one group, so each message is handled by only one of them
spring.kafka.consumer.group-id=notification-service
# First start ever: read the topic from the beginning, so messages sent before we existed aren't missed
spring.kafka.consumer.auto-offset-reset=earliest
# Key = order ID, value = JSON text (we parse the JSON ourselves)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ---------- Kafka (producer: only used to write failed messages to the dead-letter topic) ----------
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Kafka confirms only once the message is safely stored
spring.kafka.producer.acks=all

# Topic that shop-api publishes order events to
notification.kafka.topic.order-events=order-events
# Dead-letter topic: messages that still fail after all retries are parked here
notification.kafka.topic.order-events-dlt=order-events.DLT
# Must be the same as order-events' partition count (3, set in shop-api)
notification.kafka.topic.order-events-partitions=3

# ---------- Retries ----------
# When handling a message fails: wait 2 seconds, try again, up to 3 more times (4 tries in total)
notification.kafka.retry.interval-ms=2000
notification.kafka.retry.max-retries=3

# ---------- Logging ----------
# Every log line shows the request ID of the original shop-api call, e.g. [reqId=step3-check]
logging.pattern.level=%5p [reqId=%X{reqId:-}]
# Also write logs to a plain-text file, rolled daily and when it reaches 10 MB, kept for 30 days
logging.file.name=logs/notification-service.log
logging.logback.rollingpolicy.file-name-pattern=logs/notification-service-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
