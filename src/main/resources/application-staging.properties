# "staging" profile: the test environment that is set up like production. Read on top of application.properties;
# a setting here replaces the one with the same name there.
# This repository is public: never write a real address, username or password in this file.
# Each ${NAME} is read from an environment variable set on the server, e.g. DB_PASSWORD.
# If one is missing, the app fails to start, and the error shows the unfilled ${NAME}.

# Staging database (this service's own, e.g. DB_NAME=notification)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Staging Kafka servers, e.g. kafka-1:9092,kafka-2:9092
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
